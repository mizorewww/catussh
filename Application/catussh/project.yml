# Native macOS app (AppKit + SwiftUI).
# Regenerate the project with: xcodegen generate
name: catussh
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  CatusshModule: { path: ../../Foundation/CatusshModule }
  CatusshTerminal: { path: ../../Foundation/CatusshTerminal }
  CatusshEditor: { path: ../../Foundation/CatusshEditor }
  MachineStatus: { path: ../../Foundation/MachineStatus }
  MachineStatusView: { path: ../../Foundation/MachineStatusView }
  SymbolPicker: { path: ../../Foundation/SymbolPicker }
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.6.2"
    CURRENT_PROJECT_VERSION: 52
    DEVELOPMENT_TEAM: ""
targets:
  catussh:
    type: application
    platform: macOS
    sources:
      - Application
      - Extension
      - Interface
      - path: ../../Resources/EULA
        buildPhase: resources
      - path: ../../Resources/LICENSE
        buildPhase: resources
      - path: ../../Resources/catussh.icon
        buildPhase: resources
        type: folder.iconcomposer
    settings:
      base:
        PRODUCT_NAME: catussh
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: catussh
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: macOS/macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: macOS/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleDisplayName: catussh
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2022 Lakr Aream. Copyright © 2026 mizorewww and catussh contributors."
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: me.mizorewww.rayon.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: me.mizorewww.rayon
    postCompileScripts:
      - name: Record Git Commit
        basedOnDependencyAnalysis: false
        script: |
          commit="$(git -C "$SRCROOT" rev-parse --short=10 HEAD 2>/dev/null || echo unknown)"
          if [ "$commit" != unknown ] && ! git -C "$SRCROOT" diff --quiet HEAD -- 2>/dev/null; then
            commit="$commit-dirty"
          fi
          out="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/BuildInfo.plist"
          rm -f "$out"
          /usr/libexec/PlistBuddy -c "Add :GitCommit string $commit" "$out" >/dev/null
    dependencies:
      - package: CatusshModule
      - package: CatusshTerminal
      - package: CatusshEditor
      - package: MachineStatus
      - package: MachineStatusView
      - package: SymbolPicker
schemes:
  catussh:
    build:
      targets:
        catussh: all
    run:
      config: Debug
    archive:
      config: Release
