# Pushing a tag "v<version>" builds the Mac disk image (Developer ID signed and
# notarized) and the iOS .ipa (unsigned), and publishes them as a release.
#
# Run by hand (Actions → Release → Run workflow) it only builds, and keeps the
# products as artifacts of the run; without the secrets the Mac app is then
# signed ad hoc, which is enough to see that the build works.
#
# Secrets, set by Workflow/Scripts/release-secrets.sh:
#   DEVELOPER_ID_P12, DEVELOPER_ID_P12_PASSWORD   the Developer ID Application
#                                                 certificate and its key
#   NOTARY_KEY, NOTARY_KEY_ID, NOTARY_ISSUER_ID   an App Store Connect API key
#   or NOTARY_APPLE_ID, NOTARY_PASSWORD           an Apple ID and an
#                                                 app-specific password

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the app's version
        if: env.IS_TAG == 'true'
        run: |
          version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \(.*\);/\1/p' Application/catussh/catussh.xcodeproj/project.pbxproj | head -1)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag is $GITHUB_REF_NAME but the app's version is $version. Set MARKETING_VERSION, or tag v$version."
            exit 1
          fi

      - name: Set up signing
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          MAC_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          if [[ -z "$DEVELOPER_ID_P12" ]]; then
            if [[ "$IS_TAG" == true ]]; then
              echo "::error::No signing certificate in the repository's secrets; a release is not published unsigned. Run Workflow/Scripts/release-secrets.sh."
              exit 1
            fi
            echo "::warning::No signing certificate: the Mac app is signed ad hoc."
            echo "CODE_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi

          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          # The certificate's issuers, which an exported .p12 may not carry.
          for name in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$name.cer" -o "$RUNNER_TEMP/$name.cer"
            security import "$RUNNER_TEMP/$name.cer" -k "$keychain" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -c "Developer ID Application" >/dev/null

          # With the app's Developer ID provisioning profile the Mac app can
          # sync with iCloud (the key-value store, and the keychain access
          # group for the key in iCloud Keychain); without it the app is
          # built as before.
          if [[ -n "$MAC_PROFILE" ]]; then
            printf '%s' "$MAC_PROFILE" | base64 --decode > "$RUNNER_TEMP/catussh.provisionprofile"
            echo "MAC_PROVISIONING_PROFILE=$RUNNER_TEMP/catussh.provisionprofile" >> "$GITHUB_ENV"
          else
            echo "::warning::No provisioning profile in the repository's secrets: the Mac app cannot sync with iCloud."
          fi

          if [[ -n "$NOTARY_KEY" ]]; then
            printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
            {
              echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
              echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
              echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
            } >> "$GITHUB_ENV"
          elif [[ -n "$NOTARY_APPLE_ID" ]]; then
            echo "NOTARY_APPLE_ID=$NOTARY_APPLE_ID" >> "$GITHUB_ENV"
          elif [[ "$IS_TAG" == true ]]; then
            echo "::error::No notary credentials in the repository's secrets. Run Workflow/Scripts/release-secrets.sh."
            exit 1
          fi
          [[ "$IS_TAG" == true ]] && echo "REQUIRE_NOTARIZATION=1" >> "$GITHUB_ENV" || true

      - name: Build the Mac disk image
        env:
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: bash Workflow/Scripts/release.sh mac

      - name: Build the iOS .ipa
        run: bash Workflow/Scripts/release.sh ios

      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: DerivedData/Release/*.log

      - name: Keep the products
        uses: actions/upload-artifact@v4
        with:
          name: catussh
          path: |
            DerivedData/Release/catussh-*.dmg
            DerivedData/Release/catussh-*.ipa
          if-no-files-found: error

      - name: Publish the release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            DerivedData/Release/catussh-*.dmg DerivedData/Release/catussh-*.ipa \
            --title "catussh ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/catussh.provisionprofile"
