# The Mac app is a Mac Catalyst app ("Optimize for Mac" idiom) with an AppKit
# bundle (MacBridge) for what UIKit cannot reach: window material, menu bar
# items, activation policy and the legacy keychain.
# Regenerate the project with: xcodegen generate
name: catussh
options:
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  CatusshModule: { path: ../../Foundation/CatusshModule }
  CatusshTerminal: { path: ../../Foundation/CatusshTerminal }
  CatusshEditor: { path: ../../Foundation/CatusshEditor }
  MachineStatus: { path: ../../Foundation/MachineStatus }
  MachineStatusView: { path: ../../Foundation/MachineStatusView }
  SymbolPicker: { path: ../../Foundation/SymbolPicker }
  CodeMirrorUI: { path: ../../External/CodeMirrorUI }
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.6"
    CURRENT_PROJECT_VERSION: 50
    DEVELOPMENT_TEAM: ""
targets:
  MacBridge:
    type: bundle
    platform: macOS
    sources: [Bridge, Shared]
    settings:
      base:
        PRODUCT_NAME: MacBridge
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_BUNDLE_IDENTIFIER: me.mizorewww.rayon.bridge
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: Bridge
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
  catussh:
    type: application
    platform: iOS
    sources:
      - Application
      - Extension
      - Interface
      - Shared
      - path: ../../Resources/EULA
        buildPhase: resources
      - path: ../../Resources/LICENSE
        buildPhase: resources
      - path: ../../Resources/catussh.icon
        buildPhase: resources
        type: folder.iconcomposer
    settings:
      base:
        PRODUCT_NAME: catussh
        # Signed to run locally. Workflow/Scripts/build-macos.sh signs release
        # builds with a development certificate when there is one.
        CODE_SIGN_IDENTITY: "-"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "2,6"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: catussh
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: macOS/macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: macOS/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleDisplayName: catussh
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2022 Lakr Aream. Copyright © 2026 mizorewww and catussh contributors."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: me.mizorewww.rayon.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: me.mizorewww.rayon
    dependencies:
      - package: CatusshModule
      - package: CatusshTerminal
      - package: CatusshEditor
      - package: MachineStatus
      - package: MachineStatusView
      - package: SymbolPicker
      - package: CodeMirrorUI
        product: CodeEditorUI
      - target: MacBridge
        embed: true
        copy:
          destination: plugins
        platformFilter: macOS
schemes:
  catussh:
    build:
      targets:
        catussh: all
    run:
      config: Debug
    archive:
      config: Release
